; PlatformIO Project Configuration File
; Pomodoro Timer for M5Stack Cardputer ADV
;
; If you have the "M5Stack" board package installed and it already
; exposes a dedicated "m5stack-stamps3" board definition, you can swap
; `board = esp32-s3-devkitc-1` below for `board = m5stack-stamps3`.
; The devkitc-1 generic board + explicit flags works on every
; PlatformIO espressif32 install and is what M5Stack's own docs use
; for the (closely related) original Cardputer, so it's the safest
; default here.

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

; Cardputer / Cardputer-Adv use native USB-CDC for Serial + flashing
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

upload_speed = 1500000
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    m5stack/M5Unified @ ^0.2.5
    m5stack/M5GFX @ ^0.2.6
    m5stack/M5Cardputer @ ^1.0.4
